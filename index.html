<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALPHA-7 // Restricted Access</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#070907;
    --panel:#101510;
    --line:#35523a;
    --text:#d6e2d3;
    --muted:#819080;
    --accent:#8ccf7e;
    --danger:#d86a62;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:
      radial-gradient(circle at center, rgba(80,110,75,.12), transparent 42%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
      var(--bg);
    color:var(--text);
    font-family:"Courier New", monospace;
  }
  .wrap{
    width:min(92vw,560px);
    padding:34px 28px;
    border:1px solid var(--line);
    background:rgba(11,15,11,.94);
    box-shadow:0 20px 70px rgba(0,0,0,.55);
  }
  .eyebrow{
    color:var(--muted);
    font-size:12px;
    letter-spacing:.18em;
    margin-bottom:14px;
  }
  h1{
    margin:0 0 8px;
    font-size:clamp(27px,7vw,42px);
    letter-spacing:.12em;
    font-weight:700;
  }
  .restricted{
    color:var(--danger);
    letter-spacing:.12em;
    margin-bottom:30px;
  }
  label{
    display:block;
    font-size:14px;
    margin-bottom:10px;
    letter-spacing:.08em;
  }
  input{
    width:100%;
    padding:16px;
    border:1px solid var(--line);
    background:#050705;
    color:var(--accent);
    font:700 28px/1 "Courier New", monospace;
    letter-spacing:.45em;
    text-align:center;
    outline:none;
  }
  input:focus{border-color:var(--accent)}
  button{
    width:100%;
    margin-top:14px;
    padding:14px 16px;
    border:1px solid var(--accent);
    background:transparent;
    color:var(--accent);
    font:700 15px/1 "Courier New", monospace;
    letter-spacing:.14em;
    cursor:pointer;
  }
  button:hover{background:rgba(140,207,126,.08)}
  #msg{
    min-height:22px;
    margin-top:16px;
    font-size:13px;
    letter-spacing:.08em;
  }
  .bad{color:var(--danger)}
  .good{color:var(--accent)}
  #videoScreen{
    display:none;
    width:min(96vw,1000px);
    padding:0;
  }
  video{
    display:block;
    width:100%;
    max-height:92vh;
    background:#000;
  }
  .hint{
    margin-top:26px;
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
  }
</style>

<main>
  <section class="wrap" id="lockScreen">
    <div class="eyebrow">SECURE TERMINAL / ALPHA-7</div>
    <h1>RESTRICTED ACCESS</h1>
    <div class="restricted">AUTHORIZATION REQUIRED</div>

    <label for="code">ENTER 4-DIGIT AUTHORIZATION CODE</label>
    <input id="code" type="text" inputmode="numeric" autocomplete="off" maxlength="4" aria-describedby="msg">
    <button id="unlock" type="button">UNLOCK</button>
    <div id="msg" aria-live="polite"></div>

    <div class="hint">SECURITY PROTOCOL ACTIVE // UNAUTHORIZED ACCESS DENIED</div>
  </section>

  <section id="videoScreen">
    <video id="video" controls playsinline preload="metadata">
      <source src="escape-room.mp4" type="video/mp4">
      Your browser cannot play this video.
    </video>
  </section>
</main>

<script>
  const ACCESS_CODE = "6514";
  const input = document.getElementById("code");
  const button = document.getElementById("unlock");
  const msg = document.getElementById("msg");
  const lockScreen = document.getElementById("lockScreen");
  const videoScreen = document.getElementById("videoScreen");
  const video = document.getElementById("video");

  function unlock(){
    if(input.value.trim() === ACCESS_CODE){
      msg.className = "good";
      msg.textContent = "ACCESS GRANTED";
      setTimeout(() => {
        lockScreen.style.display = "none";
        videoScreen.style.display = "block";
        video.play().catch(() => {});
      }, 450);
    } else {
      msg.className = "bad";
      msg.textContent = "ACCESS DENIED";
      input.select();
    }
  }

  button.addEventListener("click", unlock);
  input.addEventListener("keydown", (e) => {
    if(e.key === "Enter") unlock();
  });
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0,4);
  });
  input.focus();
</script>
