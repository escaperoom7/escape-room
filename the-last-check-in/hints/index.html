
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#38271e">
<title>The Last Check-In | Hints</title>
<style>
:root {
  --ink:#33271f;
  --wine:#762d2b;
  --gold:#a27a45;
  --paper:#f2e9d5;
  --card:#fffaf0;
}
* {box-sizing:border-box}
body {
  margin:0;
  color:var(--ink);
  background:linear-gradient(#30221c,#4c3529);
  font-family:Georgia,'Times New Roman',serif;
}
main {
  max-width:820px;
  margin:35px auto;
  padding:34px 24px 55px;
  background:var(--paper);
  box-shadow:0 12px 45px #0006;
  border:1px solid #c2a47a;
}
.brand {
  text-align:center;
  letter-spacing:.13em;
  font-size:.8rem;
  color:#74543d;
}
.monogram {
  font-size:3rem;
  line-height:1;
  letter-spacing:-.12em;
  padding-right:.12em;
}
h1 {
  text-align:center;
  font-weight:normal;
  font-size:clamp(2rem,6vw,3.1rem);
  margin:16px 0 7px;
}
header p {
  text-align:center;
  font-style:italic;
  margin:0 0 30px;
  color:#705a49;
}
.rule {
  height:1px;
  background:linear-gradient(
    to right,transparent,var(--gold),transparent
  );
  margin:22px 0;
}
section {
  background:var(--card);
  border:1px solid #d5bd96;
  margin:16px 0;
  padding:20px 20px 16px;
  border-left:4px solid var(--wine);
}
h2 {
  font-size:1.15rem;
  letter-spacing:.06em;
  margin:0 0 15px;
  font-weight:normal;
}
details {
  border-top:1px solid #e7d9c2;
  padding:10px 0;
}
summary {
  cursor:pointer;
  font-size:.86rem;
  font-weight:bold;
  letter-spacing:.07em;
  color:var(--wine);
  list-style:none;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
summary::-webkit-details-marker {display:none}
summary:after {
  content:'+';
  font-size:1.3rem;
  font-weight:normal;
}
details[open] summary:after {content:'−'}
details p {
  line-height:1.55;
  margin:12px 0 4px;
  font-size:1rem;
}
strong {color:#622e29}
.note {
  text-align:center;
  font-size:.86rem;
  color:#766454;
  margin-top:25px;
}
button {
  border:1px solid #a9916d;
  background:transparent;
  color:var(--ink);
  font:inherit;
  padding:9px 14px;
  cursor:pointer;
}
button:hover {background:#eadcc2}
.actions {text-align:center;margin-top:22px}
@media(max-width:600px) {
  main {margin:0;padding:25px 15px;min-height:100vh}
  section {padding:17px 14px}
}
</style>
</head>
<body>
<main>
<header>
  <div class="brand">
    <div class="monogram">HR</div>
    HOTEL RAVENWOOD<br>EST. 1928
  </div>
  <h1>The Last Check-In</h1>
  <p>Confidential Guest Assistance · Hints &amp; Solutions</p>
</header>
<div class="rule"></div>
<div id="puzzles"></div>
<div class="actions">
  <button type="button" id="closeAll">Close all hints</button>
</div>
<p class="note">Hotel Ravenwood · For registered guests only</p>
</main>
<script>
const puzzles = [
  {
    title:'01 · Guest Name',
    h1:'The introductory letter may reveal more than it seems.',
    h2:'Tilt the paper and look across the logo at the top.',
    solution:'The hidden name is <strong>Eleanor Whitmore</strong>. Find her in the Guest Register and note her number.'
  },
  {
    title:'02 · Check-In Time',
    h1:'Complete the photograph. Have you checked both sides?',
    h2:'Use the cipher wheel. The photograph shows how to align it: A = H.',
    solution:'Decode the message: <strong>HEADS = HOURS. KEYS = MINUTES.</strong> Count 8 heads and 20 keys. The time is <strong>8:20</strong>. Find it in the Guest Register.'
  },
  {
    title:'03 · Room Number',
    h1:'The floor plan contains a way to hear the guest’s story.',
    h2:'Follow her route: window, lounge, plants, then Billiards & Bar. Her room is not immediately beside it.',
    solution:'Trace her route on the third floor. The room is the next one along after the room beside Billiards & Bar: <strong>317</strong>. Find it in the Guest Register.'
  },
  {
    title:'First Virtual Lock',
    h1:'You need all three answers from the first three puzzles.',
    h2:'Find each answer in the Guest Register. Enter the numbers in Guest → Time → Room order.',
    solution:'The code is <strong>557</strong>.'
  },
  {
    title:'04 · Luggage Tag',
    h1:'There is something unusual on the back of the tag.',
    h2:'Match each symbol and dot to the decoding chart.',
    solution:'Read the symbols from top to bottom: <strong>A1 – E4 – D9</strong>. Use these references in the Room Service Menu.'
  },
  {
    title:'05 · Room Service Menu',
    h1:'The luggage tag tells you where to look in the menu.',
    h2:'Letters identify menu sections; numbers tell you which word to count.',
    solution:'Find word 1 in section A, word 4 in section E and word 9 in section D. They spell <strong>WATCH THE FILM</strong>.'
  },
  {
    title:'06 · Morse Code',
    h1:'Pay attention to what you hear in the film.',
    h2:'The short and long signals are Morse code. Decode them as numbers.',
    solution:'The film gives two coordinates: <strong>(2,3)</strong> and <strong>(7,3)</strong> — column first, row second. Use them on the Lost & Found sheet.'
  },
  {
    title:'07 · Lost & Found',
    h1:'Two objects in the Lost & Found are worth a closer look.',
    h2:'Find the combs at (2,3) and (7,3). Use the physical comb to connect their marked points.',
    solution:'Align the two marked points of the physical comb with the points on the printed combs. Its teeth indicate <strong>PHOTOS</strong>. Open the photograph envelope.'
  },
  {
    title:'08 · Photographs & Calendar',
    h1:'Not every photograph is needed. Compare them with the calendar.',
    h2:'Four calendar dates are missing. Find those photos and put them in chronological order.',
    solution:'Match the four missing dates to the photographs. Read their hidden numbers in chronological order. The final lock code is <strong>2917</strong>.'
  },
  {
    title:'09 · The Last Corridor',
    h1:'Only one door is the trap. Test each possibility.',
    h2:'Could the Kitchen Door be the trap? What would that mean for its sign?',
    solution:'The Kitchen Door cannot be the trap, since that would also make the Cellar Door a trap. The Cellar Door cannot be the trap either, because its sign would contradict that possibility. The Front Door is the trap, and the <strong>KITCHEN DOOR</strong> is the way out.'
  }
];
const root = document.getElementById('puzzles');

puzzles.forEach(p => {
  const s = document.createElement('section');
  const h = document.createElement('h2');
  h.textContent = p.title;
  s.append(h);

  [
    ['HINT 1',p.h1],
    ['HINT 2',p.h2],
    ['SOLUTION',p.solution]
  ].forEach(([label,content]) => {
    const d = document.createElement('details');
    const sm = document.createElement('summary');
    const txt = document.createElement('p');
    sm.textContent = label;
    txt.innerHTML = content;
    d.append(sm,txt);
    s.append(d);
  });

  root.append(s);
});

document.getElementById('closeAll').onclick = () => {
  document.querySelectorAll('details').forEach(d => d.open=false);
};
</script>
</body>
</html>
