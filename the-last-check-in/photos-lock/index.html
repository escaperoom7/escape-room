
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Ravenwood | Security Access</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #652c35, #270d17);
  color: #e9d3a1;
  font-family: Georgia, "Times New Roman", serif;
  padding: 22px;
}
.panel {
  position: relative;
  width: 100%;
  max-width: 650px;
  padding: 45px 25px 55px;
  text-align: center;
  border: 2px solid #b78b47;
  outline: 1px solid #79512f;
  outline-offset: -11px;
  background: linear-gradient(145deg, #54202b, #37131f);
  box-shadow: 0 20px 65px #10060b;
}
.corner {
  position: absolute;
  width: 38px;
  height: 38px;
  border-color: #c49a55;
  border-style: solid;
}
.tl { top: 17px; left: 17px; border-width: 2px 0 0 2px; }
.tr { top: 17px; right: 17px; border-width: 2px 2px 0 0; }
.bl { bottom: 17px; left: 17px; border-width: 0 0 2px 2px; }
.br { bottom: 17px; right: 17px; border-width: 0 2px 2px 0; }
.emblem {
  width: 125px;
  height: 90px;
  margin: 0 auto 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 58px;
  letter-spacing: -9px;
  padding-right: 9px;
  border: 1px solid #b78b47;
  color: #e3c488;
}
.hotel {
  font-size: clamp(22px, 5vw, 35px);
  letter-spacing: 5px;
  margin: 0;
  font-weight: normal;
}
.divider {
  margin: 26px auto;
  height: 1px;
  max-width: 440px;
  background: linear-gradient(to right, transparent, #c9a05d, transparent);
}
h1 {
  font-size: clamp(25px, 6vw, 40px);
  letter-spacing: 5px;
  font-weight: normal;
  margin: 30px 0 12px;
}
.subtitle {
  font-size: 12px;
  letter-spacing: 3px;
  color: #c7a777;
}
.lock {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 45px auto 35px;
}
.lock input {
  min-width: 0;
  text-align: center;
  border: 2px solid #c69c59;
  border-radius: 4px;
  background: linear-gradient(#f4e8cc, #dcc49a);
  color: #47212b;
  font-family: Georgia, serif;
  font-weight: bold;
  box-shadow: inset 0 2px 6px #6c4c3833, 0 4px 12px #0004;
}
.lock input:nth-child(1) {
  width: 100px; height: 100px; font-size: 48px;
}
.lock input:nth-child(2) {
  width: 77px; height: 77px; font-size: 38px;
}
.lock input:nth-child(3) {
  width: 56px; height: 56px; font-size: 29px;
}
button {
  background: linear-gradient(#e4c88b, #ad7c37);
  color: #44232a;
  border: 1px solid #f3dba3;
  padding: 16px 65px;
  font-family: Georgia, serif;
  font-size: 19px;
  letter-spacing: 4px;
  cursor: pointer;
  box-shadow: 0 5px 15px #0005;
}
button:hover { filter: brightness(1.1); }
#message {
  min-height: 34px;
  margin-top: 28px;
  font-size: 21px;
  letter-spacing: 3px;
}
.success { color: #e7cc8b; }
.error { color: #f1a7a7; }
@media(max-width:480px) {
  .panel { padding: 40px 18px 48px; }
  .hotel { letter-spacing: 2px; }
  .lock { gap: 10px; }
  .lock input:nth-child(1) { width: 85px; height: 85px; }
  .lock input:nth-child(2) { width: 66px; height: 66px; }
  .lock input:nth-child(3) { width: 48px; height: 48px; }
  button { padding: 14px 48px; }
}
</style>
</head>
<body>
<main class="panel">
  <span class="corner tl"></span>
  <span class="corner tr"></span>
  <span class="corner bl"></span>
  <span class="corner br"></span>

  <div class="emblem">HR</div>
  <h2 class="hotel">HOTEL RAVENWOOD</h2>

  <div class="divider"></div>

  <h1>SECURITY ACCESS</h1>
  <p class="subtitle">ENTER THE THREE-DIGIT CODE</p>

  <div class="lock">
    <input aria-label="First digit" maxlength="1" inputmode="numeric">
    <input aria-label="Second digit" maxlength="1" inputmode="numeric">
    <input aria-label="Third digit" maxlength="1" inputmode="numeric">
  </div>

  <button id="unlock">UNLOCK</button>
  <div id="message" role="status" aria-live="polite"></div>
</main>

<script>
const inputs = [...document.querySelectorAll(".lock input")];
const message = document.getElementById("message");

inputs.forEach((input, index) => {
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0, 1);
    message.textContent = "";
    if (input.value && index < inputs.length - 1) {
      inputs[index + 1].focus();
    }
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Backspace" && !input.value && index > 0) {
      inputs[index - 1].focus();
    }
    if (event.key === "Enter") unlock();
  });
});

function unlock() {
  const code = inputs.map(input => input.value).join("");
  if (code === "651") {
    message.textContent = "ACCESS GRANTED. THE RED ENVELOPE MAY NOW BE OPENED.";
    message.className = "success";
  } else {
    message.textContent = "ACCESS DENIED";
    message.className = "error";
  }
}
document.getElementById("unlock").addEventListener("click", unlock);
</script>
</body>
</html>
