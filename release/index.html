<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALPHA-7 Emergency Release</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at center, #25292b 0%, #111415 70%);
  font-family: "Courier New", monospace;
  color: #171717;
  padding: 20px;
}

/* =========================
   MAIN METAL PANEL
========================= */

.panel {
  width: min(520px, 95vw);
  padding: 38px 28px 32px;
  position: relative;
  border: 5px solid #262626;
  border-radius: 9px;

  background:
    linear-gradient(
      115deg,
      #9b9b94 0%,
      #c0c0b8 18%,
      #96968f 48%,
      #b8b8b0 72%,
      #888881 100%
    );

  box-shadow:
    0 18px 40px rgba(0,0,0,.65),
    inset 0 0 0 2px #d1d1c9,
    inset 0 0 30px rgba(0,0,0,.25);
}


/* =========================
   SCREWS
========================= */

.screw {
  position: absolute;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #777, #222 65%);
  box-shadow: inset 0 0 3px #000;
}

.screw::after {
  content: "";
  position: absolute;
  left: 3px;
  right: 3px;
  top: 7px;
  height: 2px;
  background: #111;
  transform: rotate(-20deg);
}

.tl { top: 10px; left: 10px; }
.tr { top: 10px; right: 10px; }
.bl { bottom: 10px; left: 10px; }
.br { bottom: 10px; right: 10px; }


/* =========================
   HEADER
========================= */

.header {
  text-align: center;
  margin-bottom: 22px;
}

.alpha {
  font-weight: bold;
  font-size: 28px;
  letter-spacing: 5px;
}

.subtitle {
  font-size: 12px;
  letter-spacing: 2px;
  margin-top: 5px;
}


/* =========================
   LCD SCREEN
========================= */

.screen-frame {
  background: #242424;
  border: 3px solid #161616;
  border-radius: 7px;
  padding: 10px;

  box-shadow:
    inset 0 0 5px #000,
    0 2px 2px rgba(255,255,255,.3);

  margin: 0 auto 28px;
}

.screen {
  min-height: 105px;
  background: #123c68;
  border: 2px solid #071c31;
  color: #9edaff;
  padding: 18px 10px;
  text-align: center;

  display: flex;
  flex-direction: column;
  justify-content: center;

  text-shadow: 0 0 7px #5bbcff;

  box-shadow:
    inset 0 0 20px rgba(0,0,0,.65);
}

.screen-main {
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 1px;
}

.screen-small {
  margin-top: 10px;
  font-size: 12px;
  letter-spacing: 1px;
}


/* =========================
   INPUT LIGHTS
========================= */

.sequence {
  display: flex;
  justify-content: center;
  gap: 13px;
  margin-bottom: 25px;
}

.sequence-light {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #333;
  border: 2px solid #1c1c1c;
  box-shadow: inset 0 0 5px #000;
}


/* =========================
   LABEL
========================= */

.label {
  text-align: center;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 12px;
}


/* =========================
   COLOR BUTTONS
========================= */

.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.color-button {
  width: 67px;
  height: 67px;

  border-radius: 8px;
  border: 7px solid #292929;

  cursor: pointer;

  box-shadow:
    0 5px 0 #111,
    0 7px 8px rgba(0,0,0,.45),
    inset 0 0 8px rgba(255,255,255,.45);

  transition:
    transform .08s,
    box-shadow .08s;
}

.color-button:active {
  transform: translateY(4px);

  box-shadow:
    0 1px 0 #111,
    inset 0 0 10px rgba(0,0,0,.3);
}

.red {
  background: #d8392e;
}

.green {
  background: #26a75a;
}

.black {
  background: #181818;
}

.blue {
  background: #177bd3;
}

.yellow {
  background: #f0bd20;
}

.color-button.used {
  opacity: .28;
  cursor: default;
}


/* =========================
   BUTTON LABELS
========================= */

.button-labels {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 9px;
}

.button-label {
  width: 67px;
  text-align: center;
  font-size: 10px;
  font-weight: bold;
}


/* =========================
   CONTROLS
========================= */

.controls {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 30px;
}

.control {
  font-family: "Courier New", monospace;
  font-weight: bold;
  letter-spacing: 1px;

  padding: 11px 18px;

  border: 3px solid #333;
  border-radius: 4px;

  background: #aaa9a1;

  cursor: pointer;

  box-shadow:
    0 4px 0 #444,
    inset 0 1px 1px #ddd;
}

.control:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #444;
}

.control:disabled {
  opacity: .35;
  cursor: default;
}


/* =========================
   PANEL SUCCESS / ERROR
========================= */

.panel.granted {
  box-shadow:
    0 18px 40px rgba(0,0,0,.65),
    0 0 35px rgba(42,255,112,.45),
    inset 0 0 0 2px #d1d1c9;
}

.screen.granted-screen {
  background: #103e22;
  color: #75ff9e;
  text-shadow: 0 0 8px #55ff87;
}

.screen.denied-screen {
  background: #571713;
  color: #ff8c82;
  text-shadow: 0 0 8px #ff4136;
}


/* ==================================================
   EPIC FINAL SCREEN
================================================== */

.final-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;

  background:
    radial-gradient(circle at center, #07120b 0%, #010302 65%);

  color: #78ff9b;

  display: none;
  align-items: center;
  justify-content: center;

  overflow: hidden;
  padding: 25px;
}

.final-overlay.active {
  display: flex;
}


/* CRT SCAN LINES */

.final-overlay::before {
  content: "";
  position: absolute;
  inset: 0;

  pointer-events: none;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 2px,
      transparent 4px
    );

  z-index: 3;
}


/* GREEN SCREEN GLOW */

.final-overlay::after {
  content: "";
  position: absolute;
  inset: -20%;

  pointer-events: none;

  background:
    radial-gradient(
      circle,
      rgba(48,255,115,.10),
      transparent 55%
    );

  animation: finalPulse 2s infinite;
}


/* FINAL CONTENT */

.final-content {
  width: min(850px, 92vw);
  text-align: center;
  position: relative;
  z-index: 2;
}

.final-alpha {
  font-size: clamp(34px, 8vw, 76px);
  letter-spacing: 12px;
  font-weight: bold;

  margin-bottom: 38px;

  opacity: 0;

  text-shadow:
    0 0 10px rgba(80,255,130,.7);

  animation: appear .5s forwards;
}

.final-status {
  font-size: clamp(15px, 3vw, 26px);
  letter-spacing: 3px;
  min-height: 40px;
}


/* PROGRESS BAR */

.final-progress-wrap {
  width: 100%;
  height: 22px;

  border: 2px solid #4cff7c;

  margin: 35px 0 15px;

  padding: 3px;

  opacity: 0;

  box-shadow:
    0 0 12px rgba(76,255,124,.25);
}

.final-progress {
  height: 100%;
  width: 0%;

  background: #4cff7c;

  box-shadow:
    0 0 14px #4cff7c;
}

.final-percent {
  font-size: 14px;
  letter-spacing: 2px;
  opacity: 0;
}


/* ACCESS GRANTED */

.final-granted {
  display: none;
}

.final-granted.show {
  display: block;
  animation: finalFlash .45s ease-out;
}

.unlock-icon {
  font-size: clamp(70px, 15vw, 140px);
  margin-bottom: 15px;

  filter:
    drop-shadow(0 0 15px #42ff78);
}

.access-title {
  font-size: clamp(38px, 9vw, 90px);

  font-weight: bold;
  letter-spacing: 5px;

  text-shadow:
    0 0 10px #50ff80,
    0 0 25px #28ff69;
}

.exit-now {
  margin-top: 22px;

  font-size: clamp(18px, 4vw, 34px);

  letter-spacing: 8px;

  animation:
    blinkExit .8s infinite;
}


/* =========================
   FINAL ANIMATIONS
========================= */

.glitch {
  animation: glitch .12s 5;
}

@keyframes appear {

  from {
    opacity: 0;
    transform: scale(.96);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }

}

@keyframes glitch {

  0% {
    transform: translate(0);
  }

  25% {
    transform: translate(-3px, 2px);
  }

  50% {
    transform: translate(3px, -2px);
  }

  75% {
    transform: translate(-2px, -1px);
  }

  100% {
    transform: translate(0);
  }

}

@keyframes finalFlash {

  0% {
    opacity: 0;
    transform: scale(1.2);
  }

  50% {
    opacity: 1;
  }

  100% {
    transform: scale(1);
  }

}

@keyframes blinkExit {

  0%, 45% {
    opacity: 1;
  }

  50%, 100% {
    opacity: .25;
  }

}

@keyframes finalPulse {

  0%, 100% {
    opacity: .5;
  }

  50% {
    opacity: 1;
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:480px) {

  .panel {
    padding-left: 18px;
    padding-right: 18px;
  }

  .color-button {
    width: 55px;
    height: 55px;
    border-width: 6px;
  }

  .button-label {
    width: 55px;
  }

  .buttons,
  .button-labels {
    gap: 7px;
  }

  .final-alpha {
    letter-spacing: 7px;
  }

  .access-title {
    letter-spacing: 3px;
  }

  .exit-now {
    letter-spacing: 5px;
  }

}

</style>
</head>


<body>


<!-- ==================================================
     MAIN CONTROL PANEL
================================================== -->

<div class="panel" id="panel">

  <div class="screw tl"></div>
  <div class="screw tr"></div>
  <div class="screw bl"></div>
  <div class="screw br"></div>


  <div class="header">

    <div class="alpha">
      ALPHA-7
    </div>

    <div class="subtitle">
      EMERGENCY RELEASE SYSTEM
    </div>

  </div>


  <div class="screen-frame">

    <div class="screen" id="screen">

      <div
        class="screen-main"
        id="mainMessage">
        SYSTEM LOCKED
      </div>

      <div
        class="screen-small"
        id="smallMessage">
        ENTER RELEASE SEQUENCE
      </div>

    </div>

  </div>


  <div
    class="sequence"
    id="sequenceLights">

    <div class="sequence-light"></div>
    <div class="sequence-light"></div>
    <div class="sequence-light"></div>
    <div class="sequence-light"></div>
    <div class="sequence-light"></div>

  </div>


  <div class="label">
    RELEASE SEQUENCE INPUT
  </div>


  <!--
       VISUAL BUTTON ORDER:
       RED / GREEN / BLACK / BLUE / YELLOW
  -->

  <div class="buttons">

    <button
      class="color-button red"
      data-color="red"
      aria-label="Red">
    </button>

    <button
      class="color-button green"
      data-color="green"
      aria-label="Green">
    </button>

    <button
      class="color-button black"
      data-color="black"
      aria-label="Black">
    </button>

    <button
      class="color-button blue"
      data-color="blue"
      aria-label="Blue">
    </button>

    <button
      class="color-button yellow"
      data-color="yellow"
      aria-label="Yellow">
    </button>

  </div>


  <div class="button-labels">

    <div class="button-label">
      RED
    </div>

    <div class="button-label">
      GREEN
    </div>

    <div class="button-label">
      BLACK
    </div>

    <div class="button-label">
      BLUE
    </div>

    <div class="button-label">
      YELLOW
    </div>

  </div>


  <div class="controls">

    <button
      class="control"
      id="resetButton">
      RESET
    </button>

    <button
      class="control"
      id="verifyButton"
      disabled>
      VERIFY
    </button>

  </div>

</div>


<!-- ==================================================
     FULL SCREEN FINALE
================================================== -->

<div
  class="final-overlay"
  id="finalOverlay">

  <div class="final-content">

    <div
      class="final-alpha"
      id="finalAlpha">
      ALPHA-7
    </div>


    <div
      class="final-status"
      id="finalStatus">
      EMERGENCY OVERRIDE ACCEPTED
    </div>


    <div
      class="final-progress-wrap"
      id="finalProgressWrap">

      <div
        class="final-progress"
        id="finalProgress">
      </div>

    </div>


    <div
      class="final-percent"
      id="finalPercent">
      0%
    </div>


    <div
      class="final-granted"
      id="finalGranted">

      <div class="unlock-icon">
        🔓
      </div>

      <div class="access-title">
        ACCESS GRANTED
      </div>

      <div class="exit-now">
        EXIT NOW
      </div>

    </div>

  </div>

</div>



<script>

/* ==================================================
   CORRECT RELEASE SEQUENCE
================================================== */

const correctSequence = [
  "blue",
  "yellow",
  "red",
  "black",
  "green"
];


let playerSequence = [];


/* ==================================================
   ELEMENTS
================================================== */

const buttons =
  document.querySelectorAll(".color-button");

const lights =
  document.querySelectorAll(".sequence-light");

const verifyButton =
  document.getElementById("verifyButton");

const resetButton =
  document.getElementById("resetButton");

const mainMessage =
  document.getElementById("mainMessage");

const smallMessage =
  document.getElementById("smallMessage");

const screen =
  document.getElementById("screen");

const panel =
  document.getElementById("panel");


const colors = {

  red: "#d8392e",

  green: "#26a75a",

  black: "#181818",

  blue: "#177bd3",

  yellow: "#f0bd20"

};


/* ==================================================
   COLOR BUTTON INPUT
================================================== */

buttons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      const color =
        button.dataset.color;


      if (
        playerSequence.length >= 5 ||
        playerSequence.includes(color)
      ) {
        return;
      }


      playerSequence.push(color);

      button.classList.add("used");


      const index =
        playerSequence.length - 1;


      lights[index].style.background =
        colors[color];

      lights[index].style.boxShadow =
        "0 0 10px " + colors[color];


      mainMessage.textContent =
        "INPUT " +
        playerSequence.length +
        " / 5";


      smallMessage.textContent =
        playerSequence.length === 5
        ? "SEQUENCE READY"
        : "AWAITING NEXT NODE";


      if (
        playerSequence.length === 5
      ) {

        verifyButton.disabled =
          false;

      }

    }
  );

});


/* ==================================================
   VERIFY
================================================== */

verifyButton.addEventListener(
  "click",
  () => {

    verifyButton.disabled =
      true;


    mainMessage.textContent =
      "VERIFYING...";


    smallMessage.textContent =
      "PROCESSING RELEASE PROTOCOL";


    setTimeout(() => {

      const correct =
        playerSequence.every(
          (color, index) =>
            color ===
            correctSequence[index]
        );


      if (correct) {

        mainMessage.textContent =
          "SEQUENCE VERIFIED";


        smallMessage.textContent =
          "INITIATING EMERGENCY OVERRIDE";


        screen.classList.add(
          "granted-screen"
        );


        panel.classList.add(
          "granted"
        );


        setTimeout(() => {

          launchFinale();

        }, 900);

      }


      else {

        mainMessage.textContent =
          "ACCESS DENIED";


        smallMessage.textContent =
          "INVALID RELEASE SEQUENCE";


        screen.classList.add(
          "denied-screen"
        );

      }

    }, 1300);

  }
);


/* ==================================================
   EPIC FINALE
================================================== */

function launchFinale() {

  const overlay =
    document.getElementById(
      "finalOverlay"
    );


  const status =
    document.getElementById(
      "finalStatus"
    );


  const progressWrap =
    document.getElementById(
      "finalProgressWrap"
    );


  const progress =
    document.getElementById(
      "finalProgress"
    );


  const percent =
    document.getElementById(
      "finalPercent"
    );


  const granted =
    document.getElementById(
      "finalGranted"
    );


  overlay.classList.add(
    "active"
  );


  status.classList.add(
    "glitch"
  );


  setTimeout(() => {

    status.textContent =
      "RELEASING SECURITY LOCKS...";


    progressWrap.style.opacity =
      "1";


    percent.style.opacity =
      "1";


    let value = 0;


    const loading =
      setInterval(() => {


        value +=
          Math.floor(
            Math.random() * 9
          ) + 3;


        if (value >= 100) {

          value = 100;

        }


        progress.style.width =
          value + "%";


        percent.textContent =
          value + "%";


        if (value === 100) {

          clearInterval(
            loading
          );


          setTimeout(() => {


            status.style.display =
              "none";


            progressWrap.style.display =
              "none";


            percent.style.display =
              "none";


            granted.classList.add(
              "show"
            );


          }, 700);

        }

      }, 120);

  }, 900);

}


/* ==================================================
   RESET
================================================== */

resetButton.addEventListener(
  "click",
  resetSystem
);


function resetSystem() {

  playerSequence = [];


  mainMessage.textContent =
    "SYSTEM LOCKED";


  smallMessage.textContent =
    "ENTER RELEASE SEQUENCE";


  screen.classList.remove(
    "granted-screen",
    "denied-screen"
  );


  panel.classList.remove(
    "granted"
  );


  buttons.forEach(
    button => {

      button.classList.remove(
        "used"
      );

    }
  );


  lights.forEach(
    light => {

      light.style.background =
        "#333";


      light.style.boxShadow =
        "inset 0 0 5px #000";

    }
  );


  verifyButton.disabled =
    true;

}

</script>


</body>
</html>
