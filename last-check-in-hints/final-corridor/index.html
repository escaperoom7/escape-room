
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Ravenwood | The Final Corridor</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #14191b;
      color: #e9dcc4;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-family: 'Libre Baskerville', Georgia, serif;
    }

    .container {
      width: 100%;
      max-width: 560px;
      padding: 48px 24px;
      border: 1px solid #77613f;
      background: #1c2223;
    }

    .hotel {
      font-family: 'Cinzel', Georgia, serif;
      color: #c7a66a;
      letter-spacing: 4px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .year {
      color: #a89b83;
      font-size: 12px;
      letter-spacing: 5px;
    }

    .divider {
      width: 85px;
      height: 1px;
      background: #a88a56;
      margin: 30px auto;
    }

    h1 {
      font-family: 'Cinzel', Georgia, serif;
      font-size: clamp(23px, 5vw, 34px);
      font-weight: 600;
      color: #d3b37a;
      letter-spacing: 2px;
      line-height: 1.5;
    }

    p {
      font-size: 15px;
      line-height: 2;
      margin: 24px auto;
    }

    input {
      display: block;
      width: 180px;
      margin: 30px auto 20px;
      padding: 15px;
      background: #111617;
      border: 1px solid #a88a56;
      border-radius: 0;
      color: #e9dcc4;
      font-size: 27px;
      text-align: center;
      letter-spacing: 12px;
      outline: none;
    }

    input:focus {
      border-color: #e4c58d;
    }

    button {
      padding: 15px 36px;
      background: #b99a66;
      border: none;
      color: #171b1c;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
    }

    button:hover {
      background: #dec08b;
    }

    .error {
      color: #dc9386;
      font-size: 13px;
      min-height: 20px;
    }

    .subtitle {
      font-size: 21px;
      font-style: italic;
      color: #e9dcc4;
      margin-top: 28px;
    }

    .envelope {
      font-family: 'Cinzel', Georgia, serif;
      font-size: clamp(25px, 6vw, 38px);
      color: #d3b37a;
      line-height: 1.5;
      margin-top: 30px;
    }

    .hidden { display: none; }
  </style>
</head>

<body>

  <main class="container">

    <div class="hotel">HOTEL RAVENWOOD</div>
    <div class="year">EST. 1934</div>
    <div class="divider"></div>

    <!-- INITIAL SCREEN -->
    <section id="locked">
      <h1>THE FINAL CORRIDOR</h1>

      <p>
        TO GAIN ACCESS TO THE FINAL CORRIDOR,<br>
        ENTER THE FOUR-DIGIT CODE.
      </p>

      <form id="accessForm">
        <input
          id="code"
          type="text"
          inputmode="numeric"
          pattern="[0-9]{4}"
          maxlength="4"
          autocomplete="off"
          aria-label="Four-digit access code"
          placeholder="••••"
          required
        >

        <button type="submit">UNLOCK</button>
      </form>

      <p id="error" class="error" role="status"></p>
    </section>

    <!-- UNLOCKED SCREEN -->
    <section id="unlocked" class="hidden">

      <h1>ACCESS GRANTED</h1>

      <div class="subtitle">
        You're almost there...
      </div>

      <p>
        You may now open the envelope marked:
      </p>

      <div class="envelope">
        THE FINAL CORRIDOR
      </div>

    </section>

  </main>

  <script>
    const form = document.getElementById("accessForm");
    const input = document.getElementById("code");
    const error = document.getElementById("error");

    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(0, 4);
      error.textContent = "";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (input.value === "2917") {
        document.getElementById("locked").classList.add("hidden");
        document.getElementById("unlocked").classList.remove("hidden");
      } else {
        error.textContent = "INCORRECT CODE. PLEASE TRY AGAIN.";
        input.value = "";
        input.focus();
      }
    });
  </script>

</body>
</html>
